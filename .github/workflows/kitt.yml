# KITT checks — installed by kitt/tools/adopt/adopt.sh. The job name `checks` is the ruleset's required check;
# it always runs (no paths-ignore), so a docs-only PR goes green in seconds instead of waiting forever.
name: kitt
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: rbales79/kitt/.github/actions/pr-check@b77b643a31bac529aed182ebee434da0a9369f5e
      - uses: rbales79/kitt/.github/actions/docs-check@b77b643a31bac529aed182ebee434da0a9369f5e
      # gitleaks binary over base..head (gitleaks-action scans from <first commit>^, which fails on a root commit)
      - name: gitleaks
        env:
          GL_VERSION: 8.24.3
          GL_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          t="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$t" "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/$t"
          echo "$GL_SHA256  $RUNNER_TEMP/$t" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$t" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact -v --log-opts="$BASE_SHA..$HEAD_SHA" .
